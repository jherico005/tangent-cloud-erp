# Nginx Configuration for Tangent ERP - Production Web Cloud Deployment
# Custom Domain: https://dispatcher.tangentsolutionsinc.com
# API Endpoint: https://api.tangentsolutionsinc.com

server {
    listen 80;
    listen [::]:80;
    server_name dispatcher.tangentsolutionsinc.com api.tangentsolutionsinc.com;

    # Automatic HTTP to HTTPS Redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dispatcher.tangentsolutionsinc.com;

    # SSL Certificate Paths (Let's Encrypt / Cloudflare SSL)
    ssl_certificate /etc/letsencrypt/live/dispatcher.tangentsolutionsinc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dispatcher.tangentsolutionsinc.com/privkey.pem;

    # SSL Security & Hardening Protocol
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS Security Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root /usr/share/nginx/html;
    index index.html;

    # Static File Serving & SPA Fallback Route (Prevents 404 on page refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to Express Backend Server (Port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }

    # Static Assets Cache Control
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
}
